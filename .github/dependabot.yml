version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # Version updates batch up monthly; security updates still arrive as soon
    # as an advisory is published, independent of this schedule.
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
    # A dependency joins the first group it matches, so the domain groups
    # (which take every update type, majors included, so related packages move
    # together) must come before the catch-all.
    groups:
      django:
        patterns:
          - "django*"
          - "drf-*"
          - "djangorestframework*"
      ml:
        patterns:
          - "scikit-learn"
          - "scipy"
          - "numpy"
          - "pandas"
      data-parsing:
        patterns:
          - "ofxparse"
          - "quiffen"
          - "lxml"
          - "beautifulsoup4"
      # Everything else: minor and patch bumps share one PR. Major bumps of
      # these packages stay as individual PRs so breaking changes get looked at.
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
